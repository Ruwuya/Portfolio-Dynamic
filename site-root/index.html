<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rene Hinrichsen</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #14151a;
    color: #e8e8ec;
  }
  main {
    width: 100%;
    max-width: 560px;
    padding: 2rem;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 0.25rem;
  }
  p.subtitle {
    color: #9a9aa5;
    margin: 0 0 2rem;
  }
  .projects {
    display: grid;
    gap: 0.75rem;
  }
  .project-card {
    display: block;
    padding: 1.1rem 1.25rem;
    border-radius: 10px;
    background: #1d1e25;
    border: 1px solid #2a2b34;
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .project-card:hover {
    border-color: #4a7dff;
    transform: translateY(-1px);
  }
  .project-card strong {
    display: block;
    font-size: 1.05rem;
    margin-bottom: 0.2rem;
  }
  .project-card span {
    color: #9a9aa5;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>Rene Hinrichsen</h1>
  <p class="subtitle">Data technician apprentice &mdash; SDE Odense</p>

  <div class="projects">
    <a class="project-card" href="/portfolio/">
      <strong>Portfolio</strong>
      <span>React portfolio site &mdash; about me, projects, CV</span>
    </a>
    <a class="project-card" href="/brobyggere/">
      <strong>Brobyggere</strong>
      <span>Python course for brobyggere &mdash; Python Assignments</span>
    </a>
    <!-- Add new project cards here as they're deployed, e.g.:
    <a class="project-card" href="/currency-converter/">
      <strong>Currency Converter</strong>
      <span>Short description</span>
    </a>
    -->
  </div>
</main>
</body>
</html>
